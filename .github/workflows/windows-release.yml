name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.7.0-fixed.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Disable local Windows code-signing for CI
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.release.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.tauri.bundle.windows.certificateThumbprint = $null
          $config.tauri.bundle.windows.timestampUrl = $null
          $config.tauri.bundle.targets = @("nsis")
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding UTF8

      - name: Build Windows NSIS installer
        run: npm run app:build -- --bundles nsis

      - name: Show installer
        shell: pwsh
        run: Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object Name, Length, LastWriteTime

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasteBar-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          @"
          PasteBar custom Windows build.

          Changes:
          - Clipboard monitor automatically recovers after errors or panics.
          - Better coexistence with translation and other clipboard software.
          - Short retries when the Windows clipboard is temporarily occupied.
          - Removed remaining artificial delay before history clipboard writes.
          - Removed Quick Paste 100 ms delay and transformed-copy pre-write delay.

          Note: this CI build is unsigned, so Windows may show an unknown publisher / SmartScreen warning.
          "@ | Set-Content release-notes.md -Encoding UTF8
          gh release create "$env:RELEASE_TAG" "$($installer.FullName)" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "PasteBar $env:RELEASE_TAG" --notes-file release-notes.md
